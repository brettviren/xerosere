[project]
name = "xerosere"
version = "0.2.0"
description = "Multi-repo, multi-environment software development manager"
readme = {file = "README.org", content-type = "text/org"}
authors = [
    { name = "Brett Viren", email = "brett.viren@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "tomlkit>=0.13",
]

[project.scripts]
xerosere = "xerosere:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xerosere = ["templates/*.in"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
# test/workdir is a hand-driven playground, not a test package.
norecursedirs = ["test/workdir", ".beads", ".claude", ".venv", "*.egg-info", "build", "dist"]
